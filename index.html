<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a09">
<meta name="color-scheme" content="dark">
<title>Miami Weather</title>
<style>
/* Tokens match NARD 2.0 (public/nard-2.0/css/nard.css) so this drops into Nard as-is.
   Radar/cloud colours are data colours and live in the JS ramps, not here. */
:root {
  --bg: #0b0a09; --ink: #e9e1d6; --ink-2: #a59a8d; --ink-3: #6f675e;
  --accent: #c49a6c; --accent-2: #8e7154; --cool: #9fb3c8;
  --glass: rgba(22, 20, 18, 0.66); --line: rgba(233, 225, 214, 0.09);
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); overflow: hidden;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
body { position: fixed; inset: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.lbl { font: 9px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }

#map { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; cursor: grab; }
#map.drag { cursor: grabbing; }
.vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%),
    linear-gradient(to bottom, rgba(11,10,9,.92) 0, rgba(11,10,9,.55) calc(150px + var(--st)), transparent calc(250px + var(--st))); }
.scan { position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.07) 2px 3px); }

.hud { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
  padding: calc(12px + var(--st)) 16px calc(12px + var(--sb)); max-width: 560px; margin: 0 auto; }
.hud > * { pointer-events: auto; }

/* ---- top: dial · place · compass ---- */
.top { display: grid; grid-template-columns: 104px 1fr 64px; align-items: center; gap: 10px; }
.dial { position: relative; width: 104px; height: 104px; }
.dial svg, .compass svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dial-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial-t { font-size: 34px; font-weight: 300; line-height: 1; letter-spacing: -.02em; padding-left: 6px; }
.dial-f { margin-top: 5px; }
.place { text-align: center; min-width: 0; }
.place h1 { font-size: 17px; font-weight: 500; letter-spacing: .01em; }
.place p { font-size: 12px; color: var(--ink-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.live { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: breathe 2s infinite; }
@keyframes breathe { 50% { opacity: .35; } }
.compass { position: relative; width: 64px; height: 64px; justify-self: end; }
.compass-l { text-align: center; margin-top: 4px; white-space: nowrap; }
.wcol { display: grid; justify-items: end; }

/* ---- mode chips ---- */
.modes { display: flex; gap: 4px; margin: 12px auto 0; padding: 3px; border-radius: 999px; background: var(--glass);
  border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.mode { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px; font-size: 12px; color: var(--ink-2);
  transition: color .2s, background .2s; }
.mode svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mode[aria-pressed=true] { color: var(--bg); background: var(--ink); }

/* ---- map-side floaters ---- */
.spacer { flex: 1; min-height: 8px; pointer-events: none !important; }
.floats { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-bottom: 8px; pointer-events: none; }
.legend { pointer-events: auto; display: grid; gap: 5px; padding: 8px 10px; border-radius: 12px; background: var(--glass);
  border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); min-width: 0; }
.ramp { width: 150px; height: 6px; border-radius: 3px; }
.ramp-l { display: flex; justify-content: space-between; font: 8px/1 var(--mono); letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
.legend .lbl { font-size: 8px; letter-spacing: .12em; }
.fab { pointer-events: auto; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--glass);
  border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); color: var(--ink-2); }
.fab svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }

/* ---- bottom panel ---- */
.panel { border-radius: 22px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  padding: 4px 14px 12px; display: grid; gap: 10px; }
.grab { justify-self: center; width: 44px; height: 14px; display: grid; place-items: center; }
.grab::before { content: ""; width: 34px; height: 4px; border-radius: 2px; background: var(--line); background: rgba(233,225,214,.18); }
.ins-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ins-h .lbl { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); }
.ins-h .lbl svg { width: 10px; height: 10px; }
.ins-t { font-size: 15px; font-weight: 500; line-height: 1.3; margin-top: 6px; }
.ins-b { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.45; }
.tags { display: flex; gap: 6px; flex-wrap: nowrap; overflow: hidden; margin-top: 8px;
  -webkit-mask-image: linear-gradient(to right, #000 90%, transparent); mask-image: linear-gradient(to right, #000 90%, transparent); }
.tag[hidden] { display: none; }
.tag { font-size: 11px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap;
  background: rgba(233,225,214,.03); transition: border-color .3s, color .3s; }
.tag.hot { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.tag.zap { color: #f1ead8; border-color: rgba(214,206,255,.45); }
.tl { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; }
.play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); }
.play svg { width: 13px; height: 13px; fill: currentColor; }
.tl-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.tl-h .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-time { font: 11px/1 var(--mono); color: var(--ink); white-space: nowrap; }
.tl-time b { font-weight: 400; color: var(--accent); }
#chart { display: block; width: 100%; height: 46px; touch-action: none; cursor: ew-resize; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); padding-top: 10px; }
.stat { display: grid; gap: 4px; padding: 0 4px; }
.stat + .stat { border-left: 1px solid var(--line); padding-left: 10px; }
.stat b { font-size: 15px; font-weight: 400; white-space: nowrap; }
.stat b small { font-size: 10px; color: var(--ink-2); margin-left: 1px; }
.panel > * { min-width: 0; }
.panel.compact .ins-b, .panel.compact .tags, .panel.compact .stats { display: none; }
.foot { text-align: center; font-size: 8px; margin-top: 2px; }

.toast { position: fixed; left: 50%; top: calc(178px + var(--st)); transform: translate(-50%, -6px); opacity: 0; pointer-events: none;
  padding: 7px 13px; border-radius: 999px; font-size: 12px; background: rgba(20,19,24,.8); border: 1px solid rgba(214,206,255,.25);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); transition: opacity .35s var(--ease), transform .35s var(--ease); white-space: nowrap; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 900px) {
  .hud { margin: 0 0 0 24px; }
}
@media (max-height: 700px) {
  .stats { display: none; }
}
</style>
</head>
<body>
<canvas id="map" aria-label="Radar map of South Florida centred on Miami. Drag to pan, pinch to zoom, tap to check a spot."></canvas>
<div class="vignette"></div>
<div class="scan"></div>

<div class="hud">
  <header class="top">
    <div class="dial" aria-label="Temperature">
      <svg viewBox="0 0 104 104" aria-hidden="true">
        <defs><linearGradient id="dg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#8e7154"/><stop offset="1" stop-color="#e2bd8f"/></linearGradient></defs>
        <circle cx="52" cy="52" r="44" fill="rgba(22,20,18,.55)" stroke="rgba(233,225,214,.08)" stroke-width="5" stroke-dasharray="207.3 276.5" transform="rotate(135 52 52)" stroke-linecap="round"/>
        <circle id="dialArc" cx="52" cy="52" r="44" fill="none" stroke="url(#dg)" stroke-width="5" stroke-dasharray="0 276.5" transform="rotate(135 52 52)" stroke-linecap="round"/>
        <g id="dialTicks"></g>
        <circle id="dialFeels" r="3.2" fill="#e9e1d6" stroke="#0b0a09" stroke-width="1.5"/>
      </svg>
      <div class="dial-c"><div class="dial-t" id="temp">--°</div><div class="lbl dial-f" id="feels">feels --°</div></div>
    </div>
    <div class="place">
      <h1 id="placeName">Miami</h1>
      <p id="cond">—</p>
      <div class="live lbl"><i></i><span id="clock">--:--</span></div>
    </div>
    <div class="wcol">
      <div class="compass" aria-label="Wind direction">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="29" fill="rgba(22,20,18,.55)" stroke="rgba(233,225,214,.12)"/>
          <g id="compTicks"></g>
          <text x="32" y="12.5" text-anchor="middle" font-size="7" font-family="ui-monospace, monospace" fill="#a59a8d">N</text>
          <g id="compArrow">
            <line x1="32" y1="46" x2="32" y2="19" stroke="#c49a6c" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M32 15 l-5 7 h10 z" fill="#c49a6c"/>
            <circle cx="32" cy="47" r="2.4" fill="none" stroke="#c49a6c" stroke-width="1.4"/>
          </g>
        </svg>
      </div>
      <div class="lbl compass-l" id="windLbl">-- mph</div>
    </div>
  </header>

  <nav class="modes" role="group" aria-label="Map layer">
    <button class="mode" data-m="radar" aria-pressed="true">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M8 8 L12.4 3.6"/><circle cx="8" cy="8" r="2.6"/></svg>Radar</button>
    <button class="mode" data-m="geo" aria-pressed="false">
      <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M1.8 8h12.4M8 1.8c2 2.2 2 10.2 0 12.4M8 1.8c-2 2.2-2 10.2 0 12.4"/></svg>GeoColor</button>
    <button class="mode" data-m="wind" aria-pressed="false">
      <svg viewBox="0 0 16 16"><path d="M1.5 5.5h8.5a2 2 0 1 0-2-2M1.5 8.5h11a2 2 0 1 1-2 2M1.5 11.5h5"/></svg>Wind</button>
  </nav>

  <div class="spacer"></div>

  <div class="floats">
    <div class="legend" id="legend">
      <span class="lbl" id="legT">Precip · dBZ</span>
      <canvas class="ramp" id="ramp" width="300" height="12"></canvas>
      <div class="ramp-l" id="legL"><span>Light</span><span>Mod</span><span>Heavy</span><span>Extreme</span></div>
    </div>
    <button class="fab" id="recenter" aria-label="Back to Miami">
      <svg viewBox="0 0 18 18"><circle cx="9" cy="9" r="5"/><path d="M9 1v3M9 14v3M1 9h3M14 9h3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/></svg>
    </button>
  </div>

  <section class="panel" id="panel">
    <button class="grab" id="grab" aria-label="Expand or collapse details"></button>
    <div aria-live="polite">
      <div class="ins-h">
        <span class="lbl"><svg viewBox="0 0 10 10"><path d="M5 0 L6.2 3.8 L10 5 L6.2 6.2 L5 10 L3.8 6.2 L0 5 L3.8 3.8Z" fill="currentColor"/></svg>Nard · insight</span>
        <span class="lbl" id="updated"></span>
      </div>
      <div class="ins-t" id="insT">Reading the sky…</div>
      <div class="ins-b" id="insB"></div>
      <div class="tags" id="tags"></div>
    </div>
    <div class="tl">
      <button class="play" id="play" aria-label="Play radar loop"><svg viewBox="0 0 14 14" id="playIco"><path d="M3 1.5 L12 7 L3 12.5Z"/></svg></button>
      <div>
        <div class="tl-h"><span class="lbl" id="tlLbl">Rain here · next 2 h</span><span class="tl-time" id="tlTime">Now</span></div>
        <canvas id="chart" aria-label="Rain rate at the selected spot from one hour ago to two hours ahead. Drag to scrub."></canvas>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="lbl">Storms</span><b id="sMove">--<small>mph</small></b></div>
      <div class="stat"><span class="lbl">Humidity</span><b id="sHum">--<small>%</small></b></div>
      <div class="stat"><span class="lbl">Wind</span><b id="sWind">--<small>mph</small></b></div>
      <div class="stat"><span class="lbl" id="sRateL">Rate</span><b id="sRate">--<small>in/h</small></b></div>
    </div>
    <div class="lbl foot" id="foot">Modeled from current conditions · not live radar</div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================================
   Miami Weather — one canvas, one weather model, three views.

   Everything you see comes from a single deterministic field: storm cells (Gaussian cores
   in linear Z), advected by a steering wind derived from the observed surface wind, with
   growth/decay envelopes. The radar colours, GeoColor clouds, wind outflow, rain density,
   lightning and the insight text are all read from that one field, so they always agree.

   Conditions in: SNAPSHOT below, ?live=1 (Open-Meteo), or Nard via
   window.NardWeather.set({...}) / postMessage({type:"nard-weather", data}).
   ===================================================================================== */

const SNAPSHOT = {
  location: "Miami, FL", place: "Downtown Miami", lat: 25.7743, lon: -80.1937,
  temp_f: 82, feels_like_f: 84, humidity_pct: 83, wind_mph: 7, wind_dir_deg: 326,
  precip_in_hr: 1.2, conditions: "Rain", outlook: "High rain chance continuing into the evening",
};

const TZ = "America/New_York";
const T_MIN = -60, T_MAX = 120;         // loop window, minutes from now
const LOOP_MIN_PER_S = 6;               // playback speed
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- geography (lat, lon) → km around downtown Miami ---------------- */
const LAT0 = 25.7743, LON0 = -80.1937, RAD = Math.PI / 180;
const KX = 111.32 * Math.cos(LAT0 * RAD), KY = 110.57;
const km = (lat, lon) => [(lon - LON0) * KX, (lat - LAT0) * KY];
const ll = (x, y) => [LAT0 + y / KY, LON0 + x / KX];
const poly = a => a.map(p => km(p[0], p[1]));

const MAINLAND = poly([[27.2,-82.3],[27.2,-80.12],[26.93,-80.07],[26.70,-80.03],[26.45,-80.06],[26.32,-80.07],[26.12,-80.10],
  [25.98,-80.117],[25.93,-80.121],[25.905,-80.13],[25.88,-80.165],[25.85,-80.178],[25.80,-80.184],[25.775,-80.188],[25.755,-80.199],
  [25.735,-80.215],[25.72,-80.234],[25.70,-80.252],[25.665,-80.272],[25.62,-80.302],[25.575,-80.318],[25.53,-80.327],[25.475,-80.335],
  [25.43,-80.332],[25.39,-80.358],[25.33,-80.385],[25.28,-80.405],[25.235,-80.43],[25.205,-80.47],[25.185,-80.53],[25.17,-80.62],
  [25.155,-80.75],[25.14,-80.92],[25.125,-81.04],[25.15,-81.11],[25.24,-81.13],[25.34,-81.17],[25.48,-81.22],[25.62,-81.29],
  [25.80,-81.37],[25.90,-81.48],[26.05,-81.73],[26.25,-81.84],[26.6,-82.05],[27.2,-82.3]]);
const ISLANDS = [
  poly([[25.93,-80.117],[25.905,-80.119],[25.86,-80.12],[25.81,-80.123],[25.768,-80.13],[25.766,-80.139],[25.80,-80.142],[25.85,-80.134],[25.905,-80.128]]),
  poly([[25.738,-80.158],[25.71,-80.152],[25.675,-80.155],[25.665,-80.163],[25.69,-80.172],[25.725,-80.17]]),
  poly([[25.62,-80.165],[25.58,-80.17],[25.575,-80.178],[25.61,-80.174]]),
  poly([[25.475,-80.186],[25.43,-80.20],[25.395,-80.218],[25.39,-80.228],[25.43,-80.212],[25.47,-80.195]]),
  poly([[25.33,-80.255],[25.27,-80.30],[25.18,-80.36],[25.10,-80.43],[25.06,-80.48],[25.04,-80.505],[25.06,-80.505],[25.12,-80.44],[25.20,-80.37],[25.28,-80.31],[25.335,-80.262]]),
];
const URBAN = poly([[26.6,-80.24],[26.2,-80.28],[26.05,-80.43],[25.82,-80.44],[25.70,-80.46],[25.56,-80.49],[25.43,-80.52],[25.36,-80.51],[25.30,-80.43],[25.30,-79.9],[26.6,-79.9]]);
const BAY = poly([[25.93,-80.13],[25.86,-80.165],[25.77,-80.17],[25.70,-80.21],[25.62,-80.27],[25.50,-80.30],[25.40,-80.32],[25.30,-80.37],
  [25.25,-80.36],[25.33,-80.25],[25.45,-80.18],[25.60,-80.15],[25.74,-80.13],[25.90,-80.11]]);
const FLBAY = poly([[25.20,-80.45],[25.16,-80.95],[24.95,-81.10],[24.80,-80.75],[25.02,-80.50],[25.10,-80.42]]);
const ROADS = [ // [class, points]: 1 interstate/expressway, 2 major road
  [1, poly([[26.45,-80.10],[26.12,-80.165],[25.95,-80.20],[25.85,-80.205],[25.79,-80.205],[25.765,-80.21]])],              // I-95
  [1, poly([[26.45,-80.17],[26.1,-80.20],[25.95,-80.29],[25.85,-80.33],[25.72,-80.39],[25.60,-80.39],[25.47,-80.47],[25.44,-80.48]])], // Turnpike
  [1, poly([[26.10,-80.30],[26.15,-80.45],[26.15,-81.40],[26.16,-81.75]])],                                              // I-75 / Alligator Alley
  [1, poly([[25.928,-80.21],[25.93,-80.30],[25.90,-80.322],[25.80,-80.325],[25.70,-80.315],[25.688,-80.30]])],          // SR-826 Palmetto
  [1, poly([[25.776,-80.195],[25.78,-80.25],[25.786,-80.30],[25.78,-80.38],[25.758,-80.44]])],                          // SR-836 Dolphin
  [1, poly([[25.70,-80.315],[25.66,-80.35],[25.625,-80.385]])],                                                         // SR-874 Don Shula
  [1, poly([[25.812,-80.205],[25.814,-80.14]])], [1, poly([[25.781,-80.205],[25.776,-80.14]])],                        // I-195, I-395
  [1, poly([[26.098,-80.135],[26.10,-80.38]])], [1, poly([[26.10,-80.38],[26.20,-80.31],[26.32,-80.25]])],              // I-595, Sawgrass
  [1, poly([[25.888,-80.21],[25.885,-80.33]])],                                                                         // SR-924 Gratigny
  [2, poly([[25.765,-80.20],[25.762,-80.45],[25.757,-80.85],[25.86,-81.36]])],                                          // Tamiami Trail
  [2, poly([[25.765,-80.21],[25.70,-80.30],[25.55,-80.39],[25.45,-80.48],[25.30,-80.40],[25.20,-80.38],[25.10,-80.44],[25.03,-80.51]])], // US-1 / Overseas
  [2, poly([[25.80,-80.24],[25.87,-80.33],[26.0,-80.44],[26.3,-80.70],[26.6,-80.85]])],                                 // US-27
  [2, poly([[25.76,-80.48],[25.47,-80.48]])], [2, poly([[25.43,-80.47],[25.29,-80.37]])],                              // Krome, Card Sound
  [2, poly([[25.755,-80.205],[25.73,-80.16],[25.69,-80.16]])], [2, poly([[25.795,-80.19],[25.79,-80.14]])],             // Rickenbacker, Venetian
  [2, poly([[25.905,-80.13],[25.765,-80.135]])],                                                                       // Collins Ave
];
const LAKES = [poly([[27.20,-80.85],[27.15,-80.70],[26.98,-80.62],[26.80,-80.65],[26.70,-80.78],[26.75,-80.95],[26.90,-81.05],[27.08,-80.98]])];
const BAHAMAS = [
  poly([[25.775,-79.265],[25.72,-79.30],[25.68,-79.295],[25.70,-79.27],[25.74,-79.255]]),                                   // Bimini
  poly([[25.55,-79.27],[25.50,-79.285],[25.49,-79.275],[25.53,-79.26]]),                                                   // Cat Cay
  poly([[26.72,-79.00],[26.66,-78.80],[26.62,-78.55],[26.55,-78.35],[26.51,-78.37],[26.53,-78.62],[26.58,-78.85],[26.66,-79.0]]), // Grand Bahama

  for (let j = 0; j < GH; j++) gyW[j] = view.y - (j * STEP + STEP / 2 - AY) / view.s;
  const geo = mode === "geo", { u, q } = S;
  zGrid.fill(0); if (geo) cGrid.fill(0);
  // core-major accumulation: each core only touches its own bounding box
  const pass = (grid, spread, ampK, shift) => {
    for (const c of cores) {
      const cx = c.x + u[0] * shift * (c.db > 36 ? 1 : .3), cy = c.y + u[1] * shift * (c.db > 36 ? 1 : .3), R = c.r * spread;
      const i0 = clamp(Math.floor((cx - R - view.x) * view.s / STEP + W / 2 / STEP), 0, GW), i1 = clamp(Math.ceil((cx + R - view.x) * view.s / STEP + W / 2 / STEP), 0, GW);
      const j0 = clamp(Math.floor((AY - (cy + R - view.y) * view.s) / STEP), 0, GH), j1 = clamp(Math.ceil((AY - (cy - R - view.y) * view.s) / STEP), 0, GH);
      if (i0 >= i1 || j0 >= j1) continue;

      for (let j = j0; j < j1; j++) {

          const dx = gxW[i] - cx, a = dx * u[0] + dy * u[1], b = dx * q[0] + dy * q[1];

    const alphaK = mode === "wind" ? .32 : 1;

      const z = zGrid[k], o = k * 4;

    // GeoColor: anvils spread wider and drift downwind of the cores; lit from the low western sun.
    pass(cGrid, 1.8, .6, 4);
    for (let j = 0, k = 0; j < GH; j++) for (let i = 0; i < GW; i++, k++) {
      const z = cGrid[k] + zGrid[k] * .4, x = gxW[i], y = gyW[j];
      const cir = (vnoise(x / 9 + boil * .004, y / 4 + 3) - .45) * 1.6;           // thin cirrus streaks
      const nx = x - S.vm[0] * t, ny = y - S.vm[1] * t, tex = vnoise(nx / 5 + boil * .003, ny / 5) * .65 + vnoise(nx / 2.2 + 7, ny / 2.2) * .35;
      const db = z > 1 ? 10 * Math.log10(z) + (tex - .5) * 18 : -10;
      cGrid[k] = clamp(smooth(20, 44, db) + Math.max(0, cir) * .12, 0, 1);

      const e = cGrid[k + (i < GW - 1 ? 1 : 0)] - cGrid[k - (i > 0 ? 1 : 0)];
      const top = zGrid[k] > 2e4 ? .08 : 0;                                        // overshooting tops a touch brighter
      const lit = clamp(.74 + e * 1.3 + c * .2 + top, .5, 1.06);
      d[o] = clamp(222 * lit, 0, 255); d[o + 1] = clamp(226 * lit, 0, 255); d[o + 2] = clamp(232 * lit + (1 - c) * 18, 0, 255);
      d[o + 3] = Math.pow(c, .8) * 245;

}

/* ---------------- wind particles ---------------- */
const PN = 650, px = new Float32Array(PN), py = new Float32Array(PN), pl = new Float32Array(PN);
function seedParticle(i) { px[i] = Math.random() * W; py[i] = Math.random() * H; pl[i] = 1 + Math.random() * 3; }
for (let i = 0; i < PN; i++) seedParticle(i);
function drawWind(dt, cores) {
  const g = tctx; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.globalCompositeOperation = "destination-out"; g.fillStyle = `rgba(0,0,0,${clamp(dt * 5, .05, .4)})`; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "source-over"; g.lineWidth = 1.3; g.lineCap = "round";
  const k = .2 * dt * 60;                 // px per frame per mph (screen space, zoom independent)
  for (let i = 0; i < PN; i++) {
    const [wx, wy] = s2w(px[i], py[i]), [vx, vy] = windAt(wx, wy, cores), sp = Math.hypot(vx, vy);
    const nx = px[i] + vx * k, ny = py[i] - vy * k;
    g.strokeStyle = windColor(sp, .7); g.beginPath(); g.moveTo(px[i], py[i]); g.lineTo(nx, ny); g.stroke();
    g.fillStyle = windColor(sp, .95); g.fillRect(nx - .8, ny - .8, 1.6, 1.6);
    px[i] = nx; py[i] = ny; pl[i] -= dt;
    if (pl[i] < 0 || nx < -10 || nx > W + 10 || ny < -10 || ny > H + 10) seedParticle(i);
  }
}

/* ---------------- rain overlay ---------------- */
const DN = 340, drops = Array.from({ length: DN }, () => newDrop(true)), splashes = [];
function newDrop(any) { const z = .25 + Math.random() * .75; return { x: Math.random() * (W + 200) - 100, y: any ? Math.random() * H : -20 - Math.random() * 80, z, end: H * (.35 + Math.random() * .65), j: .8 + Math.random() * .4 }; }
function drawRain(dt, rate, rt) {
  const want = Math.min(DN, Math.round(Math.sqrt(rate) * 240) * (mode === "radar" ? 1 : mode === "geo" ? .65 : 0) * (reduceMotion ? .35 : 1));
  if (want < 1) return;
  // Drop velocity on screen: gravity (down) + horizontal wind drift scaled by wind / terminal fall speed (~9 m/s).
  const ms = WX.wind_mph * .447 * (1 + .18 * Math.sin(rt * .7) + .1 * Math.sin(rt * 1.9));
  const sx = S.u[0], sy = -S.u[1], drift = ms / 9 * 1.6;
  const vx = sx * drift, vy = 1 + Math.max(-.6, sy * drift);
  ctx.lineCap = "round";
  for (let i = 0; i < want; i++) {
    const d = drops[i], v = (560 + 900 * d.z) * d.j;
    const len = 9 + 16 * d.z;
    d.x += vx * v * dt; d.y += vy * v * dt;
    ctx.strokeStyle = `rgba(196,212,228,${(.06 + .2 * d.z) * clamp(rate * 1.5 + .3, .3, 1)})`; ctx.lineWidth = .5 + .9 * d.z;
    ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - vx * len, d.y - vy * len); ctx.stroke();
    if (d.y > d.end) { if (d.z > .78 && splashes.length < 40) splashes.push({ x: d.x, y: d.y, t: 0 }); Object.assign(d, newDrop(false)); }
    else if (d.x > W + 120 || d.x < -120) Object.assign(d, newDrop(false));
  }
  for (let i = splashes.length - 1; i >= 0; i--) {
    const s = splashes[i]; s.t += dt; if (s.t > .3) { splashes.splice(i, 1); continue; }
    const f = s.t / .3; ctx.strokeStyle = `rgba(200,215,230,${.22 * (1 - f)})`; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, 2 + f * 7, (2 + f * 7) * .35, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

/* ---------------- lightning ---------------- */
function updateLightning(dt, cores, rt) {
  const thunder = /thunder|storm/i.test(WX.conditions) ? 2 : 1;
  for (const c of cores) {
    if (c.db < 42) continue;
    const lam = .05 * Math.pow((c.db - 42) / 8, 1.5) * thunder;
    if (Math.random() < lam * dt) {
      const r = Math.sqrt(-2 * Math.log(Math.random() + 1e-9)) * 1.4, a = Math.random() * 6.283;
      const x = c.x + Math.cos(a) * r, y = c.y + Math.sin(a) * r, dist = Math.hypot(x - focus.x, y - focus.y);
      strikes.push({ x, y, rt, dist, seed: Math.random() * 1e9 | 0 });
      if (dist < 16 && !reduceMotion) { flash = Math.max(flash, (1 - dist / 16) * .9); flashT = rt; }
      if (dist < 16) toastStrike(dist);
    }
  }
  strikes = strikes.filter(s => rt - s.rt < 300);
}
function drawStrikes(rt) {
  const geo = mode === "geo";
  for (const s of strikes) {
    const age = rt - s.rt, [sx, sy] = w2s(s.x, s.y);
    if (sx < -40 || sx > W + 40 || sy < -40 || sy > H + 40) continue;
    if (geo && age < .5) {   // cloud illumination from inside the anvil
      const a = (1 - age / .5) * .55, g = ctx.createRadialGradient(sx, sy, 0, sx, sy, 60);
      g.addColorStop(0, `rgba(235,232,255,${a})`); g.addColorStop(1, "rgba(235,232,255,0)"); ctx.fillStyle = g; ctx.fillRect(sx - 60, sy - 60, 120, 120);
    }
    if (age < .22) {         // the bolt: a short branching crack
      const R = rng(s.seed); ctx.strokeStyle = `rgba(246,242,255,${1 - age / .22})`; ctx.lineWidth = 1.4;
      ctx.shadowColor = "rgba(200,190,255,.9)"; ctx.shadowBlur = 10;
      for (let b = 0; b < 3; b++) { let x = sx, y = sy, ang = R() * 6.283; ctx.beginPath(); ctx.moveTo(x, y);
        for (let k = 0; k < 4; k++) { ang += (R() - .5) * 1.4; x += Math.cos(ang) * (5 + R() * 6); y += Math.sin(ang) * (5 + R() * 6); ctx.lineTo(x, y); } ctx.stroke(); }
      ctx.shadowBlur = 0;
    }
    if (age < 1.6) { const f = age / 1.6; ctx.strokeStyle = `rgba(214,206,255,${.6 * (1 - f)})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sx, sy, 4 + f * 26, 0, 6.283); ctx.stroke(); }
    const a = .75 * (1 - age / 300);       // a small mark for five minutes
    ctx.strokeStyle = `rgba(240,234,214,${a})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(sx - 3, sy); ctx.lineTo(sx + 3, sy); ctx.moveTo(sx, sy - 3); ctx.lineTo(sx, sy + 3); ctx.stroke();
  }
}
let toastTimer = 0;
function toastStrike(dist) {
  const mi = dist * .621, secs = Math.round(dist * 1000 / 343);
  const el = document.getElementById("toast");
  el.textContent = `⚡ ${mi < 1 ? "<1" : mi.toFixed(1)} mi away · thunder in ~${secs}s`;
  el.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("on"), 3800);
  if (navigator.vibrate && dist < 5 && navigator.userActivation?.hasBeenActive) try { navigator.vibrate(18); } catch {}
  updateLightningTag();
}

/* ---------------- overlays: KAMX sweep, track, labels, pin ---------------- */
function drawSweep(rt) {
  const [sx, sy] = w2s(...KAMX), R = 60 * view.s;
  ctx.strokeStyle = "rgba(233,225,214,.05)"; ctx.setLineDash([2, 5]); ctx.lineWidth = 1;
  for (const r of [25, 50]) { ctx.beginPath(); ctx.arc(sx, sy, r * view.s, 0, 6.283); ctx.stroke(); }
  ctx.setLineDash([]);
  if (ctx.createConicGradient && !reduceMotion) {
    const a = (rt * .9) % 6.283, g = ctx.createConicGradient(a - .55, sx, sy);
    g.addColorStop(0, "rgba(196,154,108,0)"); g.addColorStop(.0875, "rgba(196,154,108,.07)"); g.addColorStop(.0876, "rgba(196,154,108,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, R, 0, 6.283); ctx.fill();
  }
  ctx.fillStyle = "rgba(196,154,108,.7)"; ctx.fillRect(sx - 2, sy - 2, 4, 4);
  label("KAMX", sx + 6, sy + 3, "rgba(196,154,108,.55)", 8);
}
function drawTrack(cores) {
  // Storm track for the strongest nearby core: where it'll be in 15/30/45 min.
  let best = null, bs = -1e9;
  for (const c of cores) { if (c.db < 40) continue; const [sx, sy] = w2s(c.x, c.y); if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
    const sc = c.db - Math.hypot(c.x - focus.x, c.y - focus.y) * .35; if (sc > bs) { bs = sc; best = c; } }
  if (!best) return;
  const [x0, y0] = w2s(best.x, best.y), [x1, y1] = w2s(best.x + S.vm[0] * 45, best.y + S.vm[1] * 45);
  ctx.strokeStyle = "rgba(233,225,214,.55)"; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); ctx.setLineDash([]);
  const ang = Math.atan2(y1 - y0, x1 - x0);
  ctx.fillStyle = "rgba(233,225,214,.7)"; ctx.beginPath(); ctx.moveTo(x1 + Math.cos(ang) * 6, y1 + Math.sin(ang) * 6);
  ctx.lineTo(x1 + Math.cos(ang + 2.5) * 6, y1 + Math.sin(ang + 2.5) * 6); ctx.lineTo(x1 + Math.cos(ang - 2.5) * 6, y1 + Math.sin(ang - 2.5) * 6); ctx.fill();
  for (const m of [15, 30]) {
    const [tx, ty] = w2s(best.x + S.vm[0] * m, best.y + S.vm[1] * m);
    ctx.fillStyle = "rgba(233,225,214,.85)"; ctx.beginPath(); ctx.arc(tx, ty, 2, 0, 6.283); ctx.fill();
    label(clock(tDisp + m), tx + 6, ty - 5, "rgba(233,225,214,.6)", 8);
  }
  ctx.strokeStyle = "rgba(233,225,214,.6)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x0, y0, 7, 0, 6.283); ctx.stroke();
}
function label(text, x, y, color, size = 10, weight = "") {
  ctx.font = `${weight} ${size}px ui-monospace, "SF Mono", Menlo, monospace`;
  ctx.fillStyle = "rgba(0,0,0,.65)"; ctx.fillText(text, x + 1, y + 1); ctx.fillStyle = color; ctx.fillText(text, x, y);
}
function drawLabels() {
  const tier = view.s > 10 ? 3 : view.s > 4.2 ? 2 : 1;
  ctx.textBaseline = "middle";
  for (const p of PLACES) {
    if (p.t > tier) continue;
    const [sx, sy] = w2s(p.x, p.y); if (sx < -60 || sx > W + 10 || sy < 0 || sy > H) continue;
    if (Math.hypot(p.x - focus.x, p.y - focus.y) * view.s < 18) continue;
    const big = p.t === 1;
    ctx.fillStyle = "rgba(233,225,214,.5)"; ctx.beginPath(); ctx.arc(sx, sy, big ? 1.8 : 1.3, 0, 6.283); ctx.fill();
    label(big ? p.n.toUpperCase() : p.n, sx + 6, sy, big ? "rgba(233,225,214,.82)" : "rgba(233,225,214,.55)", big ? 10 : 9);

}
function drawPin(rt) {
  const [sx, sy] = w2s(focus.x, focus.y), p = reduceMotion ? .5 : (rt * .6) % 1;
  ctx.strokeStyle = `rgba(196,154,108,${.55 * (1 - p)})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(sx, sy, 7 + p * 18, 0, 6.283); ctx.stroke();
  ctx.fillStyle = "#c49a6c"; ctx.beginPath(); ctx.arc(sx, sy, 5, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "#f4ece0"; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.textBaseline = "middle"; label(focus.name.toUpperCase(), sx + 11, sy, "#f1e7d8", 10, "600"); ctx.textBaseline = "alphabetic";
}

/* ---------------- time ---------------- */
const T0 = Date.now();
function clock(min) {
  return new Date(T0 + min * 60000).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ });
}
const clock5 = min => clock(Math.round((min + (T0 / 60000) % 5) / 5) * 5 - (T0 / 60000) % 5);

/* ---------------- series + insight ---------------- */
function rateAtFocus(t, boil = 0) {
  const isObs = Math.hypot(focus.x, focus.y) < .5 && Math.abs(t) < 1.5;
  return isObs ? WX.precip_in_hr : dbzToRate(dbzAt(focus.x, focus.y, t, boil));
}
function rebuildSeries() {
  series = []; for (let t = T_MIN; t <= T_MAX; t += 3) series.push({ t, r: rateAtFocus(t) });
  drawChart(); writeInsight();
}
function writeInsight() {
  const fut = []; for (let t = 0; t <= 150; t += 2) fut.push({ t, r: rateAtFocus(t) });
  const now = fut[0].r, cat = rateCat(now), place = focus.name;
  const fromDir = dirName(WX.wind_dir_deg), toDir = dirName(S.toDeg);
  const idx = (from, pred) => { for (let i = from; i < fut.length; i++) if (pred(fut[i], i)) return i; return -1; };
  const dryRun = i => fut.slice(i, i + 5).every(p => p.r < .02);
  let title, body, tags = [], quietWind = false;   // quietWind: the dry-now advice already covers umbrellas
  const fmtR = r => r >= .095 ? r.toFixed(1) : r.toFixed(2);
  if (now >= .02) {
    const heavy = now >= .3;
    const iEase = heavy ? idx(1, p => p.r < .1) : -1;
    const iEnd = idx(1, (p, i) => dryRun(i));
    const from = iEnd > 0 ? iEnd : iEase;
    const iNext = from > 0 ? idx(from, p => p.r >= (heavy ? .3 : .05)) : -1;
    const Cat = cat[0].toUpperCase() + cat.slice(1);
    title = `${Cat} rain` + (iEase > 0 ? ` · eases by ${clock5(fut[iEase].t)}` : iEnd > 0 ? ` · clears by ${clock5(fut[iEnd].t)}` : " · settling in");
    body = `The core is sliding ${toDir}` + (iEnd > 0 ? ` and it dries out near ${clock5(fut[iEnd].t)}` : iEase > 0 ? `; lighter rain lingers behind it` : "");
    body += iNext > 0 ? `, then a ${heavy ? "heavier " : ""}band from the ${fromDir} arrives around ${clock5(fut[iNext].t)}.` : ".";
    tags.push(["☂ Umbrella", "hot"]);
    if (iNext > 0) tags.push([`Next band ${clock5(fut[iNext].t)}`]);
    else if (iEnd > 0) tags.push([`Dry ${clock5(fut[iEnd].t)}`]);
    if (now >= .5) tags.push(["Ponding on roads"]);
  } else {
    const iOn = idx(1, p => p.r >= .05);
    if (iOn > 0) {
      const peak = Math.max(...fut.slice(iOn).map(p => p.r));
      title = `Dry now · rain by ${clock5(fut[iOn].t)}`;
      body = `${rateCat(peak)[0].toUpperCase() + rateCat(peak).slice(1)} rain moves in from the ${fromDir}. Head out before ${clock5(fut[iOn].t)} or take an umbrella.`;
      quietWind = true;
      tags.push([`Rain ${clock5(fut[iOn].t)}`, "hot"], ["☂ Bring one"]);
    } else { title = "Dry for the next couple of hours"; body = `Nothing heading for ${place} on the current motion.`; tags.push(["No umbrella"]); }
  }
  const w = WX.wind_mph;
  if (!(quietWind && w < 15)) body += w < 15 ? ` Light ${fromDir} wind, so an umbrella holds up.` :
          w < 25 ? ` Gusty ${fromDir} wind — a sturdy umbrella helps.` : ` Too windy for an umbrella; wear a rain jacket.`;
  if (now >= .02 && /evening/i.test(WX.outlook || "") && !/arrives/.test(body)) body += " Rain chances stay high into the evening.";
  document.getElementById("insT").textContent = title;
  document.getElementById("insB").textContent = body;
  const tg = document.getElementById("tags"), mk = ([t, c]) => { const s = document.createElement("span"); s.className = "tag" + (c ? " " + c : ""); s.textContent = t; return s; };
  const z = mk(["", "zap"]); z.id = "zapTag"; z.hidden = true;
  const els = tags.slice(0, 3).map(mk); els.splice(1, 0, z); tg.replaceChildren(...els);
  updateLightningTag();
}
function updateLightningTag() {
  const z = document.getElementById("zapTag"); if (!z) return;
  const near = strikes.filter(s => s.dist < 16).map(s => s.dist);
  if (!near.length) { z.hidden = true; return; }
  z.hidden = false; z.textContent = `⚡ ${(Math.min(...near) * .621).toFixed(1)} mi · ${near.length} in 5 min`;
}

/* ---------------- chart / timeline ---------------- */
const chart = document.getElementById("chart"), cctx = chart.getContext("2d");
function drawChart() {
  if (!series.length) return;
  const w = chart.clientWidth, h = chart.clientHeight; if (!w) return;
  if (chart.width !== Math.round(w * DPR)) { chart.width = Math.round(w * DPR); chart.height = Math.round(h * DPR); }
  const g = cctx; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, w, h);
  const top = 4, bot = h - 12, X = t => (t - T_MIN) / (T_MAX - T_MIN) * w, Y = r => bot - (bot - top) * Math.min(1, Math.sqrt(r / 2));
  g.strokeStyle = "rgba(233,225,214,.06)"; g.lineWidth = 1;
  for (const r of [.1, .3, 1]) { g.beginPath(); g.moveTo(0, Y(r) + .5); g.lineTo(w, Y(r) + .5); g.stroke(); }
  const bw = w / series.length;
  for (const p of series) {
    if (p.r < .005) { g.fillStyle = "rgba(233,225,214,.08)"; g.fillRect(X(p.t) - bw / 2 + .5, bot - 1, bw - 1, 1); continue; }
    g.fillStyle = lutCss(rateToDbz(p.r), p.t > 0 ? .8 : .95); g.fillRect(X(p.t) - bw / 2 + .5, Y(p.r), Math.max(1, bw - 1), bot - Y(p.r));
  }
  g.fillStyle = "rgba(233,225,214,.05)"; g.fillRect(X(0), top, w - X(0), bot - top);           // forecast side
  g.strokeStyle = "rgba(196,154,108,.9)"; g.beginPath(); g.moveTo(X(0) + .5, 0); g.lineTo(X(0) + .5, bot); g.stroke();
  const ph = X(tDisp); g.strokeStyle = "#e9e1d6"; g.lineWidth = 1.5; g.beginPath(); g.moveTo(ph, 0); g.lineTo(ph, bot); g.stroke();
  g.fillStyle = "#e9e1d6"; g.beginPath(); g.arc(ph, 2.5, 2.5, 0, 6.283); g.fill();
  g.font = "8px ui-monospace, monospace"; g.fillStyle = "rgba(233,225,214,.4)"; g.textBaseline = "alphabetic";
  for (const [t, s] of [[-60, "-1h"], [0, "NOW"], [60, "+1h"], [120, "+2h"]]) { const tw = g.measureText(s).width; g.fillText(s, clamp(X(t) - tw / 2, 0, w - tw), h - 2); }
}
function setTime(t) {
  tDisp = clamp(t, T_MIN, T_MAX);
  const el = document.getElementById("tlTime"), d = Math.round(tDisp);
  el.innerHTML = Math.abs(d) < 2 ? "<b>Now</b>" : `${clock(d)} <b>${d > 0 ? "+" : "−"}${Math.abs(d)}m</b>`;
  const r = rateAtFocus(tDisp);
  document.getElementById("sRate").innerHTML = `${r < .01 ? "0" : r >= .095 ? r.toFixed(1) : r.toFixed(2)}<small>in/h</small>`;
}
function setPlaying(p) {
  playing = p; introStop = false;
  document.getElementById("playIco").innerHTML = p ? '<path d="M3 1.5h3v11H3zM8 1.5h3v11H8z"/>' : '<path d="M3 1.5 L12 7 L3 12.5Z"/>';
  document.getElementById("play").setAttribute("aria-label", p ? "Pause radar loop" : "Play radar loop");
}
document.getElementById("play").onclick = () => { if (!playing && tDisp >= T_MAX - .5) setTime(T_MIN); setPlaying(!playing); };
{
  let scrub = false;
  const at = e => { const r = chart.getBoundingClientRect(); setTime(T_MIN + clamp((e.clientX - r.left) / r.width, 0, 1) * (T_MAX - T_MIN)); drawChart(); };
  chart.addEventListener("pointerdown", e => { scrub = true; chart.setPointerCapture(e.pointerId); setPlaying(false); at(e); });
  chart.addEventListener("pointermove", e => scrub && at(e));
  chart.addEventListener("pointerup", () => { scrub = false; if (Math.abs(tDisp) < 4) { setTime(0); drawChart(); } });
}

/* ---------------- gestures on the map ---------------- */
{
  const pts = new Map(); let last = null, moved = 0, downT = 0, pinch = null;
  cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { last = [e.clientX, e.clientY]; moved = 0; downT = performance.now(); cv.classList.add("drag"); }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), s: view.s }; } });
  cv.addEventListener("pointermove", e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      zoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, pinch.s * d / pinch.d / view.s); moved = 99; return; }
    if (pts.size === 1 && last) { const dx = e.clientX - last[0], dy = e.clientY - last[1]; moved += Math.abs(dx) + Math.abs(dy);
      view.x -= dx / view.s; view.y += dy / view.s; last = [e.clientX, e.clientY]; viewChanged(); } });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (pts.size === 1) last = [...pts.values()][0];
    if (pts.size === 0) { cv.classList.remove("drag"); if (moved < 7 && performance.now() - downT < 400) setFocus(...s2w(e.clientX, e.clientY)); last = null; } };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .0015)); }, { passive: false });
}
function zoomAt(sx, sy, f) {
  const [wx, wy] = s2w(sx, sy); view.s = clamp(view.s * f, 1.2, 40);
  const [nx, ny] = s2w(sx, sy); view.x += wx - nx; view.y += wy - ny; viewChanged();
}
function viewChanged() {
  view.x = clamp(view.x, -200, 220); view.y = clamp(view.y, -200, 200);
  baseDirty = true; tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, trail.width, trail.height);
}
function setFocus(x, y) {
  let best = null, bd = 1e9;
  for (const p of PLACES) { const d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = p; } }
  if (Math.hypot(x, y) < 1.5) { x = 0; y = 0; focus.name = SNAPSHOT.place; }
  else if (bd < 3.5) { x = best.x; y = best.y; focus.name = best.n; }
  else { const [la, lo] = ll(x, y); focus.name = `${la.toFixed(2)}°, ${Math.abs(lo).toFixed(2)}°W`; }
  focus.x = x; focus.y = y;
  document.getElementById("tlLbl").textContent = `Rain · ${focus.name}`;
  strikes.forEach(s => s.dist = Math.hypot(s.x - x, s.y - y));
  rebuildSeries(); setTime(tDisp);
}
document.getElementById("recenter").onclick = () => {
  view.x = -4; view.y = -4; view.s = clamp(Math.max(W, H * .5) / 74, 4, 16); viewChanged(); setFocus(0, 0);
};
document.getElementById("grab").onclick = () => { document.getElementById("panel").classList.toggle("compact"); requestAnimationFrame(drawChart); };

/* ---------------- modes + legend ---------------- */
const ramp = document.getElementById("ramp"), rctx = ramp.getContext("2d");
function drawLegend() {
  rctx.clearRect(0, 0, 300, 12);
  const T = document.getElementById("legT"), L = document.getElementById("legL");
  if (mode === "radar" || mode === "wind" && false) {
    for (let i = 0; i < 300; i++) { rctx.fillStyle = lutCss(17 + i / 300 * 50); rctx.fillRect(i, 0, 1, 12); }
    T.textContent = "Precip · dBZ"; L.innerHTML = "<span>Light</span><span>Mod</span><span>Heavy</span><span>Extreme</span>";
  } else if (mode === "geo") {
    const g = rctx.createLinearGradient(0, 0, 300, 0); g.addColorStop(0, "#0c2a40"); g.addColorStop(.4, "#6f7d88"); g.addColorStop(1, "#f2f4f8");
    rctx.fillStyle = g; rctx.fillRect(0, 0, 300, 12);
    T.textContent = "GeoColor · simulated"; L.innerHTML = "<span>Clear</span><span>Thin</span><span>Deep cloud</span>";
  } else {
    for (let i = 0; i < 300; i++) { rctx.fillStyle = windColor(i / 300 * 32, 1); rctx.fillRect(i, 0, 1, 12); }
    T.textContent = "Wind · outflow"; L.innerHTML = "<span>0</span><span>10</span><span>20</span><span>30 mph</span>";
  }
}
document.querySelectorAll(".mode").forEach(b => b.onclick = () => {
  mode = b.dataset.m; document.querySelectorAll(".mode").forEach(x => x.setAttribute("aria-pressed", x === b));
  baseDirty = true; tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, trail.width, trail.height); drawLegend();
});

/* ---------------- HUD ---------------- */
function drawHud() {
  const f = clamp((WX.temp_f - 50) / 50, 0, 1), f2 = clamp((WX.feels_like_f - 50) / 50, 0, 1);
  document.getElementById("dialArc").setAttribute("stroke-dasharray", `${(207.3 * f).toFixed(1)} 276.5`);
  const a = (135 + 270 * f2) * RAD; const fd = document.getElementById("dialFeels");
  fd.setAttribute("cx", 52 + Math.cos(a) * 44); fd.setAttribute("cy", 52 + Math.sin(a) * 44);
  let ticks = ""; for (let i = 0; i <= 10; i++) { const aa = (135 + 27 * i) * RAD, r1 = i % 2 ? 36.5 : 35, r2 = 38.5;
    ticks += `<line x1="${52 + Math.cos(aa) * r1}" y1="${52 + Math.sin(aa) * r1}" x2="${52 + Math.cos(aa) * r2}" y2="${52 + Math.sin(aa) * r2}" stroke="rgba(233,225,214,${i % 2 ? .15 : .3})" stroke-width="1"/>`; }
  document.getElementById("dialTicks").innerHTML = ticks;
  let ct = ""; for (let i = 0; i < 16; i++) { const aa = i * 22.5 * RAD, r1 = i % 4 ? 26.5 : 24.5;
    ct += `<line x1="${32 + Math.sin(aa) * r1}" y1="${32 - Math.cos(aa) * r1}" x2="${32 + Math.sin(aa) * 28}" y2="${32 - Math.cos(aa) * 28}" stroke="rgba(233,225,214,${i % 4 ? .14 : .35})"/>`; }
  document.getElementById("compTicks").innerHTML = ct;
  document.getElementById("compArrow").setAttribute("transform", `rotate(${S.toDeg} 32 32)`);
  document.getElementById("temp").textContent = Math.round(WX.temp_f) + "°";
  document.getElementById("feels").textContent = `feels ${Math.round(WX.feels_like_f)}°`;
  document.getElementById("windLbl").textContent = `${Math.round(WX.wind_mph)} mph ${dirName(WX.wind_dir_deg)}`;
  document.getElementById("placeName").textContent = (WX.location || "Miami").split(",")[0];
  document.getElementById("cond").textContent = `${WX.conditions} · ${rateCat(WX.precip_in_hr) === "none" ? "dry" : rateCat(WX.precip_in_hr)} · ${WX.humidity_pct}% RH`;
  document.getElementById("sMove").innerHTML = `${Math.round(S.stormMph)}<small>mph ${dirName(S.toDeg)}</small>`;
  document.getElementById("sHum").innerHTML = `${Math.round(WX.humidity_pct)}<small>%</small>`;
  document.getElementById("sWind").innerHTML = `${Math.round(WX.wind_mph)}<small>mph ${dirName(WX.wind_dir_deg)}</small>`;
  document.getElementById("updated").textContent = "as of " + clock(0);
}
function tickClock() {
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: TZ, timeZoneName: "short" });
}

/* ---------------- frame ---------------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; const rt = now / 1000;
  if (playing && now > holdUntil) {
    const nt = tDisp + dt * LOOP_MIN_PER_S;
    if (introStop && tDisp < 0 && nt >= 0) { setTime(0); setPlaying(false); }
    else if (nt >= T_MAX) { setTime(T_MAX); holdUntil = now + 1200; setTimeout(() => { if (playing) setTime(T_MIN); }, 1200); }
    else setTime(nt);
    drawChart();
  }
  if (baseDirty) drawBase();
  const cores = coresAt(tDisp);
  computeField(tDisp, rt, cores);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(base, 0, 0, W, H);
  if (mode === "geo") {   // cloud shadows fall east of the clouds under a low western sun
    ctx.imageSmoothingEnabled = true; ctx.drawImage(shadowC, 5, 3, W, H);
  }
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(fieldC, 0, 0, W, H);
  ctx.globalAlpha = mode === "geo" ? .55 : 1; ctx.drawImage(ovl, 0, 0, W, H); ctx.globalAlpha = 1;   // reference layer, softer over clouds
  if (mode === "radar") { drawSweep(rt); drawTrack(cores); }
  if (mode === "wind") { drawWind(dt, cores); ctx.drawImage(trail, 0, 0, W, H); }
  updateLightning(dt, cores, rt);
  drawStrikes(rt);
  drawLabels();
  drawPin(rt);

  const target = rateAtFocus(tDisp, rt);
  rainLevel += (target - rainLevel) * Math.min(1, dt * 2.5);
  drawRain(dt, rainLevel, rt);

  if (flash > .01) {      // double-pulse flicker, then decay
    const a = rt - flashT, pulse = a < .06 ? 1 : a < .11 ? .25 : a < .17 ? .8 : Math.exp(-(a - .17) * 9);
    ctx.fillStyle = `rgba(226,228,255,${flash * .32 * pulse})`; ctx.fillRect(0, 0, W, H);
    if (a > .7) flash = 0;
  }
  requestAnimationFrame(frame);
}

/* ---------------- conditions in ---------------- */
function normalize(d) {
  // Accepts this file's shape or Nard's get_weather tool output ({ location, now: {...} }).
  const n = d.now || d, o = { ...WX };
  const num = (v, k) => (typeof v === "number" && isFinite(v)) ? (o[k] = v) : null;
  num(n.temp_f, "temp_f"); num(n.feels_like_f, "feels_like_f"); num(n.humidity_pct, "humidity_pct");
  num(n.wind_mph, "wind_mph"); num(n.wind_dir_deg ?? d.wind_dir_deg, "wind_dir_deg");
  num(n.precip_in_hr ?? (typeof n.precip_in === "number" ? n.precip_in * (n.precip_window_min ? 60 / n.precip_window_min : 1) : undefined), "precip_in_hr");
  if (typeof n.conditions === "string") o.conditions = n.conditions[0].toUpperCase() + n.conditions.slice(1);
  if (typeof d.location === "string") o.location = d.location;
  if (typeof d.outlook === "string") o.outlook = d.outlook;
  return o;
}
function setConditions(d) {
  WX = normalize(d || {}); buildScenario(WX); drawHud(); strikes = []; rebuildSeries(); setTime(tDisp);
}
window.NardWeather = { set: setConditions, get: () => ({ ...WX }), mode: m => document.querySelector(`.mode[data-m="${m}"]`)?.click(), focus: (lat, lon) => setFocus(...km(lat, lon)) };
addEventListener("message", e => { if (e.source === window.parent && e.data && e.data.type === "nard-weather") setConditions(e.data.data); });

async function tryLive() {
  if (!/[?&]live=1/.test(location.search)) return;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT0}&longitude=${LON0}&current=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FNew_York`;
    const r = await fetch(url, { signal: AbortSignal.timeout(6000) }); if (!r.ok) return;
    const c = (await r.json()).current || {};
    const code = c.weather_code, cond = code >= 95 ? "Thunderstorms" : code >= 80 ? "Showers" : code >= 61 ? "Rain" : code >= 51 ? "Drizzle" : code >= 3 ? "Cloudy" : code >= 1 ? "Partly cloudy" : "Clear";
    // Open-Meteo "current" precipitation is the preceding 15-minute total.
    setConditions({ temp_f: c.temperature_2m, feels_like_f: c.apparent_temperature, humidity_pct: c.relative_humidity_2m, wind_mph: c.wind_speed_10m,
      wind_dir_deg: c.wind_direction_10m, precip_in: c.precipitation, precip_window_min: 15, conditions: cond });
  } catch {}
}

/* ---------------- boot ---------------- */
makePatterns();
buildScenario(WX);
addEventListener("resize", resize);
resize(); drawHud(); drawLegend(); tickClock(); setInterval(tickClock, 15000);
setInterval(updateLightningTag, 5000);
rebuildSeries();
if (reduceMotion) { setTime(0); setPlaying(false); } else { setTime(T_MIN); setPlaying(true); introStop = true; }
requestAnimationFrame(frame);
tryLive();
</script>
